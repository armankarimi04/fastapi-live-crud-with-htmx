<tr id="row-{{ row_index }}" x-data="{ editing: false }" class="text-center">
    <th scope="row">
        {{ row_index }}
        <input type="hidden" name="row_index" id="row_index_value_{{ item.id }}" value="{{ row_index }}">
    </th>
    <td>
        <input x-show="!editing" type="checkbox" class="checkbox checkbox-sm">
        <input x-show="editing" type="checkbox" class="checkbox checkbox-sm" checked>
    </td>
    <td>
        <span x-show="!editing">{{ item.name }}</span>
        <input x-show="editing" id="product_name_{{ item.id }}" class="input input-xs h-6" type="text" name="name"
            value="{{ item.name }}">
    </td>
    <td>
        <span x-show="!editing">{{ item.category.name }}</span>
        <div x-show="editing" id="categories-list">
            <button class="btn btn-xs btn-dash w-24 h-12" x-show="editing" hx-get="/load-categories"
                hx-target="closest div" hx-swap="innerHTML">
                Load categories
            </button>
            <select name="category_id" id="product_category_id_{{ item.id }}">
                <option value="{{ item.category.id }}">{{ item.category.name }}</option>
            </select>
        </div>

    </td>
    <td>
        <span x-show="!editing">{{ item.in_stock }}</span>
        <input x-show="editing" id="product_in_stock_{{ item.id }}" class="input input-xs h-6" type="number" min="0"
            max="100" name="in_stock" value="{{ item.in_stock }}">
    </td>
    <td>
        {% if item.available %}
            <span x-show="!editing" class="text-xl text-green-500">&#10003;</span>
        {% else %}
            <span x-show="!editing" class="text-xl text-red-600">&#10007;</span>
        {% endif %}
            <input x-show="editing" id="product_available_{{ item.id }}" type="checkbox" class="checkbox" name="available"
            {% if item.available %} checked {% endif %}>
    </td>
    <td>
        <span x-show="!editing">{{ item.price }} Toomans</span>
        <input x-show="editing" type="number" id="product_price_{{ item.id }}" value="{{ item.price }}" name="price" class="input input-xs h-6" placeholder="0">
    </td>
    <td>
        <!-- In-line Edit in progress actions: Confirm and Cancel -->
        <div class="flex gap-4 justify-center" x-show="editing">
            <button 
                class="btn btn-sm btn-success btn-outline btn-circle" 
                x-show="editing" 
                hx-put="/items/{{ item.id }}"
                hx-include="#product_name_{{ item.id }}, #product_category_id_{{ item.id }}, #product_in_stock_{{ item.id }}, #product_available_{{ item.id }}, #product_price_{{ item.id }}, #row_index_value_{{ item.id }}"
                hx-target="#row_{{ row_index }}" 
                hx-swap="outerHTML">

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                </svg>

            </button>
            <button class="btn btn-sm btn-error btn-outline btn-circle" x-show="editing" @click="editing = false">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Normal Actions In-Line Edit, Full Edit, Set Discount, Remove, Disable item -->
        <div class="flex gap-4 justify-center">
            <div class="tooltip" data-tip="Edit row in-line">
                <button x-show="!editing" @click="editing = true" class="btn btn-circle btn-outline btn-accent btn-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                    </svg>
                </button>
            </div>

            <div class="tooltip" data-tip="Full Edit" x-show="!editing">
                <button class="btn btn-circle btn-outline btn-warning btn-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6 13.5V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m12-3V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m-6-9V3.75m0 3.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 9.75V10.5" />
                    </svg>
                </button>
            </div>

            <div class="tooltip" data-tip="Set discount" x-show="!editing">
                <button class="btn btn-circle btn-outline btn-default btn-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 11.25v8.25a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5v-8.25M12 4.875A2.625 2.625 0 1 0 9.375 7.5H12m0-2.625V7.5m0-2.625A2.625 2.625 0 1 1 14.625 7.5H12m0 0V21m-8.625-9.75h18c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125h-18c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
                    </svg>

                </button>
            </div>


            <div class="tooltip" data-tip="Remove item" x-show="!editing">
                <button class="btn btn-circle btn-error btn-outline btn-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                    </svg>
                </button>
            </div>

            <div class="tooltip" data-tip="Disable item" x-show="!editing">
                <button class="btn btn-circle btn-default btn-outline btn-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                    </svg>
                </button>
            </div>
        </div>
    </td>
</tr>
