{% extends "_base.html" %}


{% block content %}
<div>
    <button class="btn btn-primary"
            hx-get="/get-message"
            hx-target="#response-holder"
            hx-trigger="click"
            hx-swap="innerHTML"
        >Get Message
    </button>
    <div id="response-holder"></div>


    <button class="btn btn-secondary mt-8" hx-get="/static/css/style.css" hx-swap="download">
        Download Report
    </button>
</div>
{% endblock content %}
